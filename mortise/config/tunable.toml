# 可調參數清單：自動調參（python -m mortise.eval tune）只會在這裡列出的範圍內搜尋。
# 每個 [[param]]：
#   path  設定檔中的位置「節.鍵」（對應 default.toml）
#   min / max / step  搜尋範圍與步距（與設定值同單位）；或用 values = [...] 列出離散候選
#   note  白話說明
# 初始清單先涵蓋 [structure]（④結構）與 [settings]（⑤設定）中的門檻。範圍是工程判斷，待真實樣本校正。

[[param]]
path = "structure.paragraph_gap_factor"
min = 1.15
max = 2.2
step = 0.05
note = "行距超過「一般行距 × 此值」就分段"

[[param]]
path = "structure.line_pitch_tolerance"
min = 0.04
max = 0.3
step = 0.02
note = "行距一致性的容差（比例）"

[[param]]
path = "structure.left_align_tolerance"
min = 0.002
max = 0.02
step = 0.001
note = "左緣對齊的容差（頁寬比例）"

[[param]]
path = "structure.short_line_ratio"
min = 0.6
max = 0.95
step = 0.02
note = "行寬小於「段落寬 × 此值」視為段落最後一行"

[[param]]
path = "structure.size_tolerance"
min = 0.01
max = 0.1
step = 0.01
note = "字級相同的容差（比例）"

[[param]]
path = "structure.title_size_ratio"
min = 1.15
max = 2.0
step = 0.05
note = "字級超過內文中位數此倍數，候選為標題"

[[param]]
path = "settings.size_snap_tolerance_pt"
min = 0.0
max = 0.3
step = 0.02
note = "字級距離格點在此值以內才吸附（pt）"

[[param]]
path = "settings.size_snap_step_pt"
values = [0.1, 0.25, 0.5, 1.0]
note = "字級吸附的格距（pt）"

[[param]]
path = "settings.line_spacing_tolerance"
min = 0.0
max = 0.1
step = 0.01
note = "行距倍數吸附的容差"

[[param]]
path = "settings.font_line_height"
min = 1.1
max = 1.3
step = 0.02
note = "不知道字型量度時，單倍行距約為字級的幾倍"

[[param]]
path = "settings.box_width_slack_pt"
min = 0.0
max = 6.0
step = 0.5
note = "文字框寬度多留的餘裕（pt），降低目標軟體重新斷行的機率"

[[param]]
path = "settings.page_snap_tolerance_pt"
min = 0.0
max = 3.0
step = 0.25
note = "頁面尺寸吸附到標準規格的容差（pt）"

# ---- ② 頁面（照片）：改這些會從②重跑；只改確認門檻時工作影像不變，③沿用快取 ----
# 前兩個只決定「要不要請使用者確認四角」，不改輸出：用回饋庫裡使用者拖過的四角（system_value.within_tolerance 與信心值）校準最有效。
# 範圍是工程判斷（合成照片 193 張的校準見 default.toml 的說明），待真實照片校正。

[[param]]
path = "page.quad_review_confidence"
min = 0.3
max = 0.85
step = 0.05
note = "照片的頁面四角信心值低於此值就請使用者確認（也決定 status 是否為 ok）"

[[param]]
path = "page.quad_max_corner_err_frac"
min = 0.004
max = 0.03
step = 0.002
note = "任一角的估計誤差超過影像對角線的此比例，就請使用者確認四角"

[[param]]
path = "page.dewarp_bow_px"
min = 1.0
max = 6.0
step = 0.5
note = "紙邊弓高超過 max(此值, 0.2% 邊長) 像素才算彎曲（彎的紙才攤平）"

[[param]]
path = "page.dewarp_flat_sag_median_pct"
min = 0.05
max = 0.3
step = 0.025
note = "頁內格線與文字行離直線的最大距離（佔頁寬 %）中位數低於此值才算平的紙（平的紙只做透視攤平）"
