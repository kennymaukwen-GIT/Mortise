[export]                             # ⑥ 輸出
image_format = "png"
# ---- 可編輯 PDF（exporters/pdf_editable.py）：設定加在這一行下面，名稱以 pdf_ 開頭 ----
pdf_text_object = "paragraph"        # 文字物件的寫法：paragraph（一段一個，行與行用 T*）或 line（一行一個）
pdf_font_embed = "subset"            # 字型內嵌方式：subset（只內嵌用到的字形）或 full（整個字型；檔案大，換不到可編輯性）
pdf_tagged = true                    # 是否寫結構標記（Tagged PDF：標題、段落、表格、圖、閱讀順序、語言）
pdf_lang = "auto"                    # 文件語言（BCP 47，例如 zh-Hant-TW）；auto 由文字的書寫系統推斷
pdf_lang_cjk = "zh-Hant"             # 推斷為中文時寫的語言代碼（書寫系統分不出繁簡與地區）
pdf_lang_latin = "en"                # 推斷為拉丁字母文字時寫的語言代碼
pdf_justify_word_space = true        # 左右對齊且有空白的行只撐開空白（TJ 位移）；false 則整行一致的字距（Tc），完全不用 TJ
pdf_line_fit = true                  # 採用⑦開的逐行對位修正單（原生輸入：每一行對回來源的行首位置與字距）
pdf_layers = false                   # 是否另外寫 OCG 圖層（背景、圖片、形狀、文字）
pdf_ua_claim = false                 # 是否在 XMP 宣告 PDF/UA-1（沒有用 veraPDF 驗證過，預設不宣告）
pdf_font_deny_prefixes = ["Unifont"] # 不內嵌的字型（字族名稱的開頭）；GNU Unifont 是 GPL 附字型例外，授權待法務確認前先不內嵌
# ---- SVG（exporters/svg.py）：設定加在這一行下面，名稱以 svg_ 開頭 ----
svg_text = "text"                    # 文字的寫法：text（可編輯的文字，一行一個 text）或 outline（轉成外框路徑，不可再編輯）
svg_size_unit = "pt"                 # 根元素 width、height：pt（帶單位，各軟體實體尺寸一致；Illustrator 未實測）或 none（不帶單位）
svg_precision = 2                    # 座標與長度的小數位數
svg_images = "embed"                 # 圖片：embed（data URI 內嵌）或 external（另存在 zip 的 images/ 下，輸出一律是 zip）
svg_layers = "element"               # element（每個元素的群組標成 Inkscape 圖層並帶名稱）或 none（不寫 inkscape: 屬性）
svg_primitives = true                # 向量圖的路徑認得出基本圖形時寫成 rect、circle、ellipse、line、polygon
svg_kerning_aware = true             # 置中、靠右、左右對齊的行，用含字距微調的行寬修正起點與間距（各軟體畫字時都會套用字距微調）
svg_tspan_y = false                  # 行內片段的 tspan 另寫 y：resvg 這類渲染器才會逐片段選字型；編輯軟體的行為未實測，預設不寫
svg_hairline_pt = 0.25               # 來源是 PDF 零寬細線的筆畫，在 SVG 裡寫成多寬（pt，初始值）
svg_outline_slant_deg = 12.0         # 文字轉外框而字型沒有斜體檔時，字形傾斜的角度（初始值）
svg_page_background = "auto"         # 頁面底色：auto（最底層一定畫頁面底色，⑤沒有底色就是白色；深色模式的看圖軟體才不會變黑底）或 none（只有⑤指定了底色才畫，其餘透明）。單獨向量圖（svg_assets）一律透明
# ---- Word（exporters/docx_*.py）：設定加在這一行下面，名稱以 docx_ 開頭 ----
# 寫進檔案的字型名稱（見 exporters/docx_common.py「寫入的字型名稱」）。成品文件裡⑤推論的字型不改，原本的名稱記在降級紀錄。
docx_font_names = "portable"         # portable：換成多數裝置都有、或字寬相容的字型；inferred：照推論的名稱寫（舊做法，冷門字型也照寫）
docx_font_map = [                    # 1. 字寬相容的對照（推論的名稱 → 寫進檔案的名稱），量度相同，換了不會跑版（與 [fonts.substitutes] 方向相反）
