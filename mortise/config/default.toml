# Mortise 設定檔：門檻、容差、吸附表。每個階段一節；改某一節只會讓該階段之後重跑。
# 標示「初始值」的數字是工程判斷，待評測調整。

[input]                              # ① 輸入
max_file_mb = 100                    # 檔案大小上限（MB）
max_pages = 200                      # 頁數上限
max_image_megapixels = 100           # 單張影像像素上限（百萬像素）
native_min_chars = 5                 # 一頁至少幾個真文字字元才算原生 PDF（初始值）
scan_image_coverage = 0.85           # 單張圖佔頁面面積超過此比例，視為掃描頁（初始值）
hidden_text_ratio = 0.8              # 不可見文字超過此比例，判為 OCR 文字層（初始值）
unicode_error_ratio = 0.3            # 缺 Unicode 對照的字元超過此比例，改走影像產線（初始值）

[page]                               # ② 頁面
working_dpi = 150                    # 工作影像解析度（dpi）
max_working_pixels = 40000000        # 工作影像像素上限
assumed_image_dpi = 96               # 影像沒有尺寸資訊時假設的 dpi（信心值低）
size_auto_accept = 0.6               # 尺寸候選的信心值超過此值就自動採用，否則請使用者選（初始值）
enhance_photos = true                # 照片與掃描檔先去陰影、白平衡再辨識

[recognize]                          # ③ 辨識
line_gap_factor = 1.5                # 同一基線上兩字間距超過「字級 × 此值」就拆成兩行
baseline_tolerance = 0.25            # 基線高度差超過「字級 × 此值」視為不同行
background_blank_tolerance = 6       # 背景與底色的像素差在此值以內視為空白（0 到 255）
background_blank_ratio = 0.0005      # 超出容差的像素比例低於此值，就不輸出底圖
full_page_coverage = 0.98            # 矩形或圖片佔頁面比例超過此值，視為整頁底
min_image_pixels = 4                 # 寬或高小於此像素的圖片忽略
image_line = true                    # 影像輸入走影像辨識產線（關掉則整頁以圖片輸出）
text_mask_dilate_px = 2              # 擦字時把筆畫遮罩外擴幾個像素（避開反鋸齒的殘影）
ocr_low_score = 0.8                  # 文字辨識信心值低於此值的行，提醒使用者確認
ai_char_prob = 0.6                   # 第一名候選字的機率低於此值、且與第二名相差不到 ai_char_margin，請 AI 在候選中挑
ai_char_margin = 0.25
ai_max_lines = 12                    # 一頁最多送幾行給 AI 挑字
traditional_prior = true             # 繁體文件中把讀成簡體的字改回繁體（OpenCC 對照表）
bullet_detection = true              # 找出文字辨識漏掉的行首項目符號
implausible_height_ratio = 4.0       # 一兩個字、高度超過其他文字此倍數、信心不高的偵測，當成圖形
implausible_min_score = 0.97
join_max_gap_factor = 4.0            # 同一基線上相距不超過幾個字寬的片段，可能接成同一行
max_vector_paths = 300               # 一頁的複雜向量路徑超過這個數量，整批留在底圖（避免插畫被拆成上千個形狀）
max_path_segments = 400              # 單一路徑的線段超過這個數量，留在底圖
# ---- 原生 PDF 的向量圖與扁平化內容（stages/s3_recognize.py、stages/s3_flattened.py）：設定加在這一行下面 ----
# 註：讀得出來的路徑不再因為數量多而留在底圖。上面兩個上限現在的意思是：
#   max_path_segments：單一路徑的線段超過這個數量，不當成形狀，自己成為一個向量圖；
#   max_vector_paths：零散（沒有成群）的自由路徑超過這個數量，不各自變成形狀，依繪製順序合成向量圖。
pdf_vector_join_gap = 0.002          # 兩條路徑的外框相距不超過這個距離（頁寬比例）就算同一個圖形（初始值）
pdf_vector_join_gap_ratio = 0.1      # 或相距不超過「兩者中較小者的長邊 × 此值」（初始值）
pdf_vector_min_paths = 3             # 一群至少幾條路徑才算向量圖；不夠的各自維持是形狀
pdf_vector_min_segments = 24         # 一群至少幾段線段才算向量圖（三個箭頭、幾個三角形不算）
pdf_vector_min_straight_paths = 8    # 全部只有直線的群（箭頭、折線這類簡單圖形）至少要幾條才算向量圖（初始值）
pdf_vector_absorb_max_area = 0.6     # 夾在一群中間的矩形、圓、直線，面積不超過整群外框的這個比例才算進這一群
pdf_vector_raster_dpi = 300          # 向量圖對應的透明底圖片的解析度（dpi）
pdf_vector_raster_max_pixels = 8000000  # 那張圖片的像素上限；超過就降低解析度
pdf_vector_raster_page_pixels = 24000000  # 一頁所有向量圖的圖片像素總量上限；超過就一起降低解析度
pdf_vector_raster_min_dpi = 100      # 因為總量上限而降低解析度時的下限（dpi）
pdf_vector_max_groups = 60           # 一頁分出來的向量圖超過這個數量（地圖、工程圖），不再細分，依繪製順序合併成幾層
pdf_outlined_min_glyphs = 6          # 一行至少幾個字形才認定是「文字轉外框」（頁面有真的文字時）
pdf_outlined_min_glyphs_suspected = 3  # ①已經懷疑整頁文字轉外框時的門檻
pdf_outlined_aligned_share = 0.6     # 一行裡至少這個比例的字形要對齊同一條基線（或中線）
pdf_outlined_max_gap = 1.2           # 同一行相鄰字形的間距上限（字高的倍數）
pdf_outlined_max_height = 0.08       # 字形高度上限（頁寬比例）；更高的當成圖形
pdf_outlined_line_pitch = 3.2        # 上下兩行的基線距離不超過字高的幾倍，算同一塊文字
pdf_outlined_to_text = true          # 文字轉成的外框：辨識過關就變回可編輯的文字（stages/s3_flattened.py）
pdf_outlined_text_min_confidence = 0.9  # 一行的辨識信心值至少這麼高才轉成文字；不足的保留成外框向量圖（初始值）
pdf_outlined_align_max_cost = 0.6    # 字形與辨識出的字對齊時，字形中心離字的範圍最遠幾個行高（初始值）
pdf_outlined_fit_max_error = 0.12    # 外框與字型墨跡外框的幾何殘差上限（em）；超過表示字形對應錯了，不轉（初始值）
pdf_outlined_max_angle_deg = 1.5     # 只轉接近水平的行（度）；斜的與直排的保留成外框
pdf_outlined_ocr_glyph_px = 48       # 畫外框給文字辨識時，讓主要字形高約這麼多像素
pdf_outlined_ocr_min_dpi = 72        # 那張影像的解析度範圍（dpi）
pdf_outlined_ocr_max_dpi = 600
pdf_outlined_ocr_max_pixels = 16000000  # 那張影像的像素上限
pdf_outlined_font_probe_lines = 3    # 每群取最長的幾行做字型重繪比對（其餘的行只用幾何在這些候選中挑）
# ---- 描圖向量化（recognition/vectorize.py）：設定加在這一行下面，名稱以 vector_ 開頭 ----
vector_enabled = true                # 影像產線：插畫（標誌、圖示、圖表）描成向量路徑；照片不描
vector_min_size_px = 12              # 寬或高小於此像素的插畫不描
vector_accept_delta_e = 4.0          # 重畫的平均色差（ΔE）在此值以內才交出向量圖（雜訊大時自動放寬；初始值）
vector_accept_p95 = 22.0             # 色差第 95 百分位的上限（初始值）
vector_accept_iou = 0.9              # 重畫的覆蓋範圍與原圖的交集 ÷ 聯集下限（初始值）
vector_accept_blob_fraction = 0.01   # 成塊對不上的面積比例上限（漏掉細節或有明暗變化；初始值）
vector_max_refine_rounds = 2         # 誤差成塊時最多放細門檻重描幾輪
vector_fit_tol_px = 0.25             # 曲線擬合的容許誤差（像素；會依量到的雜訊放寬；初始值）
vector_prim_tol_px = 0.3             # 認成基本幾何（矩形、圓角矩形、圓、橢圓）的容許誤差（像素；初始值）
vector_snap_tol_px = 0.3             # 扶正成水平、垂直時容許移動的距離（像素），不超過量測誤差
vector_stroke_max_width_px = 8.0     # 寬度在此值以內而且等寬的細線還原成「中心線加線寬」（初始值）
vector_layered = true                # 分層輸出：被上層遮住的部分補成完整形狀；關掉則全部是互相挖洞的拼圖
vector_gradients = true              # 偵測線性與放射漸層
vector_max_megapixels = 16.0         # 影像大於此值（百萬像素）先縮小再描

[structure]                          # ④ 結構
paragraph_gap_factor = 1.45          # 行距超過「一般行距 × 此值」就分段（初始值）
line_pitch_tolerance = 0.12          # 行距一致性的容差（比例）
left_align_tolerance = 0.006         # 左緣對齊的容差（頁寬比例）
short_line_ratio = 0.82              # 行寬小於「段落寬 × 此值」視為段落最後一行（初始值）
size_tolerance = 0.03                # 字級相同的容差（比例）
title_size_ratio = 1.4               # 字級超過內文中位數此倍數，候選為標題
page_number_band = 0.12              # 頁面底部此比例高度內的短數字，候選為頁碼
master_min_pages = 3                 # 至少幾頁才做跨頁母片分析
master_repeat_ratio = 0.6            # 元素在超過此比例的頁面重複出現，列為母片候選
ai_role_confidence = 0.7             # 有段落的角色信心值低於此值，就請大型 AI 判斷角色與閱讀順序
ai_min_paragraphs = 2                # 段落少於此數不必問 AI

[settings]                           # ⑤ 設定
size_snap_step_pt = 0.5              # 字級吸附的格距（pt）
size_snap_tolerance_pt = 0.06        # 精確擷取的值距離格點在此值以內才吸附；否則保留原值（「不吸附」永遠是候選）
size_snap_sigma = 1.5                # 量測值的吸附容差 = 此倍數 × 量測誤差（初始值）
settle_size_rel = 0.06               # 同一段內字級差距小於此比例視為同一字級（量測產線，初始值）
settle_font_conf = 0.5               # 某段自己的字型信心低於此值，就改用同段投票的字型（初始值）
bold_relative_ratio = 1.3            # 筆畫粗細比超過同字級（±25%）文字此倍數才算粗體（量測產線，初始值）
bold_group_min_chars = 30            # 同字級群組至少要有這麼多字，才用相對比較；不夠就沿用③的判斷
dark_text_conf = 0.6                 # 顏色信心低於此值、近乎無彩、亮度 L 低於 dark_text_max_l 的文字當成黑字
dark_text_max_l = 60
thin_stroke_px = 2.5                 # 筆畫細於此值（工作影像像素）時，量到的深灰當成黑字
paper_small_text_pt = 14             # 白紙類照片上小於此字級的深灰字當成黑字
font_skip_prefixes = ["Unifont"]     # 不當成字型候選的後備字型（名稱開頭）
color_merge_delta_e = 12.0           # 文字顏色差距（ΔE）小於此值歸成同一色（量測產線，初始值）
color_snap_black_white_delta_e = 10.0  # 接近純黑或純白（ΔE）就吸到純黑、純白
page_snap_tolerance_pt = 0.5         # 頁面尺寸吸附到標準規格的容差（pt）
line_spacing_candidates = [1.0, 1.15, 1.2, 1.5, 2.0]  # 行距倍數候選
line_spacing_tolerance = 0.03        # 行距倍數吸附的容差
font_line_height = 1.2               # 不知道字型量度時，單倍行距約為字級的幾倍（初始值）
box_width_slack_pt = 1.5             # 文字框寬度多留的餘裕（pt），降低目標軟體重新斷行的機率
single_line_no_wrap = true           # 單行文字關閉自動換行

[export]                             # ⑥ 輸出
image_format = "png"
# ---- 可編輯 PDF（exporters/pdf_editable.py）：設定加在這一行下面，名稱以 pdf_ 開頭 ----
pdf_text_object = "paragraph"        # 文字物件的寫法：paragraph（一段一個，行與行用 T*）或 line（一行一個）
pdf_font_embed = "subset"            # 字型內嵌方式：subset（只內嵌用到的字形）或 full（整個字型；檔案大，換不到可編輯性）
pdf_tagged = true                    # 是否寫結構標記（Tagged PDF：標題、段落、表格、圖、閱讀順序、語言）
pdf_lang = "auto"                    # 文件語言（BCP 47，例如 zh-Hant-TW）；auto 由文字的書寫系統推斷
pdf_lang_cjk = "zh-Hant"             # 推斷為中文時寫的語言代碼（書寫系統分不出繁簡與地區）
pdf_lang_latin = "en"                # 推斷為拉丁字母文字時寫的語言代碼
pdf_justify_word_space = true        # 左右對齊且有空白的行只撐開空白（TJ 位移）；false 則整行一致的字距（Tc），完全不用 TJ
pdf_line_fit = true                  # 採用⑦開的逐行對位修正單（原生輸入：每一行對回來源的行首位置與字距）
pdf_layers = false                   # 是否另外寫 OCG 圖層（背景、圖片、形狀、文字）
pdf_ua_claim = false                 # 是否在 XMP 宣告 PDF/UA-1（沒有用 veraPDF 驗證過，預設不宣告）
pdf_font_deny_prefixes = ["Unifont"] # 不內嵌的字型（字族名稱的開頭）；GNU Unifont 是 GPL 附字型例外，授權待法務確認前先不內嵌
# ---- SVG（exporters/svg.py）：設定加在這一行下面，名稱以 svg_ 開頭 ----
svg_text = "text"                    # 文字的寫法：text（可編輯的文字，一行一個 text）或 outline（轉成外框路徑，不可再編輯）
svg_size_unit = "pt"                 # 根元素 width、height：pt（帶單位，各軟體實體尺寸一致；Illustrator 未實測）或 none（不帶單位）
svg_precision = 2                    # 座標與長度的小數位數
svg_images = "embed"                 # 圖片：embed（data URI 內嵌）或 external（另存在 zip 的 images/ 下，輸出一律是 zip）
svg_layers = "element"               # element（每個元素的群組標成 Inkscape 圖層並帶名稱）或 none（不寫 inkscape: 屬性）
svg_primitives = true                # 向量圖的路徑認得出基本圖形時寫成 rect、circle、ellipse、line、polygon
svg_kerning_aware = true             # 置中、靠右、左右對齊的行，用含字距微調的行寬修正起點與間距（各軟體畫字時都會套用字距微調）
svg_tspan_y = false                  # 行內片段的 tspan 另寫 y：resvg 這類渲染器才會逐片段選字型；編輯軟體的行為未實測，預設不寫
svg_hairline_pt = 0.25               # 來源是 PDF 零寬細線的筆畫，在 SVG 裡寫成多寬（pt，初始值）
svg_outline_slant_deg = 12.0         # 文字轉外框而字型沒有斜體檔時，字形傾斜的角度（初始值）

[verify]                             # ⑦ 驗證
render_dpi = 100                     # 比對用的渲染解析度（dpi）
position_tolerance_pt = 1.5          # 位置誤差合格線（pt，初始值）
position_fix_threshold_pt = 0.3      # 位置誤差超過此值就開修正單把文字框移回去（pt，初始值）
similarity_pass = 0.97               # 整頁相似度合格線（0 到 1，初始值）
max_rounds = 2                       # 修正迴圈最多幾輪
low_confidence = 0.7                 # 信心值低於此值的元素，在預覽中標出來請使用者確認（初始值）
neutral = true                       # 7A 中性驗證（需要 ai_pdf 輸出器）
neutral_similarity_pass = 0.95       # 中性渲染與原圖的相似度合格線（初始值）
libreoffice_timeout_s = 120          # 目標渲染逾時（秒）
# ---- 可編輯 PDF 的目標驗證（verify/pdf_target.py）：設定加在這一行下面，名稱以 pdf_ 開頭 ----
pdf_similarity_pass = 0.95           # 輸出檔重新畫出來與工作影像的相似度合格線（初始值）
pdf_position_tolerance_pt = 0.5      # 讀回來的每個字與排版預期位置的容許差（pt）
pdf_size_tolerance_pt = 0.05         # 讀回來的字級與成品文件的容許差（pt）
pdf_source_position_tolerance_pt = 0.5  # 原生輸入：讀回來的行首與來源文字行的容許差（pt）
pdf_object_tolerance_pt = 0.1        # 圖片與向量路徑範圍的容許差（pt）
pdf_check_objects = true             # 檢查圖片數量與位置、向量圖的路徑數與屬性
pdf_check_structure = true           # 檢查結構標記（輸出器關掉結構標記時自動略過）
pdf_check_source = true              # 另外與③讀到的來源文字行比對（只報告，不計入文字一致率）
pdf_fit = true                       # 原生輸入：排版結果與來源文字行的差超過容許差時，開修正單請輸出器逐行對位
pdf_fit_tolerance_pt = 0.25          # 逐行對位：行首或行內累積的位置差超過此值才修正（pt，初始值）
pdf_fit_max_gap_ratio = 0.4          # 逐行對位：一行需要的位移點超過字數的此比例，就改用整行一致的字距（初始值）
pdf_fit_max_width_change = 0.12      # 逐行對位：來源行寬與排版行寬相差超過此比例就不對位（多半是使用者改過字型或字級；初始值）
# ---- SVG 的目標驗證（verify/svg_target.py）：設定加在這一行下面，名稱以 svg_ 開頭 ----
svg_render = true                    # 用 resvg 把 SVG 畫出來比相似度；false 只做結構檢查與文字讀回
svg_similarity_pass = 0.95           # SVG 渲染後與工作影像的相似度合格線（初始值）
svg_position_tolerance_pt = 0.1      # 讀回來的文字行位置與成品文件排版的容許差（pt）
svg_emulate_bold = true              # 伺服器上的字型沒有粗體檔時，渲染前補同色描邊模擬粗體（不改輸出檔）
svg_font_dirs = []                   # 渲染用的字型目錄；空的表示用 fontconfig 列出的字型（與輸出時量行寬用的是同一批）

[ai]                                 # 大型 AI（只回答編號、標籤、或在候選中選擇）
enabled = true                       # 有憑證才會真的呼叫；沒有憑證時流水線照常跑，全用規則判斷
provider = "anthropic"
model = "claude-opus-5-5"            # 可改成其他型號；Fable 與 Mythos 系列需要 30 天資料保留
effort = "medium"                    # low、medium、high、xhigh、max
fallbacks = "default"                # 模型拒答時由伺服器自動改用其他模型（空字串表示關閉）
timeout_s = 120
max_calls_per_page = 2               # 每頁、每個 AI 使用點最多呼叫幾次（含不合法時的重問）
max_cost_per_document_usd = 0.5      # 每份文件的 AI 花費上限（美元）
price_input_per_mtok = 4.0           # 單價（美元／百萬 token），用來估算花費並套用上限
price_output_per_mtok = 20.0
max_image_long_edge = 2576           # 送給模型的影像長邊上限（像素）
structure = true                     # ④段落角色與閱讀順序
ocr_arbitration = true               # ③信心值低的字在候選中挑選

